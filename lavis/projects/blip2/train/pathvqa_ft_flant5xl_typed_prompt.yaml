model:
  arch: blip2_t5
  model_type: pretrain_flant5xl
  load_finetuned: False
  use_grad_checkpoint: True
  freeze_vit: True
  max_txt_len: 128
  apply_lemmatizer: False

datasets:
  path_vqa:
    prompt_mode: "typed"
    vis_processor:
      train:
        name: "blip2_image_train"
        image_size: 224
      eval:
        name: "blip_image_eval"
        image_size: 224
    text_processor:
      train:
        name: "blip_question"
      eval:
        name: "blip_question"
    build_info:
      annotations:
        train:
          storage:
            - /root/autodl-tmp/pvqa/qas/train_vqa.pkl
        val:
          storage:
            - /root/autodl-tmp/pvqa/qas/val_vqa.pkl
        test:
          storage:
            - /root/autodl-tmp/pvqa/qas/test_vqa.pkl
      images:
        storage: /root/autodl-tmp/pvqa/images

run:
  task: path_vqa
  lr_sched: "linear_warmup_cosine_lr"
  init_lr: 1e-5
  min_lr: 0
  warmup_lr: 1e-8
  warmup_steps: 500
  weight_decay: 0.05
  max_epoch: 15
  batch_size_train: 4
  batch_size_eval: 16
  num_workers: 4
  accum_grad_iters: 4

  max_len: 20
  min_len: 1
  num_beams: 5
  inference_method: "generate"
  prompt: ""

  seed: 42
  output_dir: "output/BLIP2/PathVQA_ft_flant5xl_typed_prompt"

  amp: True
  resume_ckpt_path: null

  evaluate: False
  train_splits: ["train"]
  valid_splits: ["val"]
  test_splits: ["test"]

  device: "cuda"
  world_size: 1
  dist_url: "env://"
  distributed: True
