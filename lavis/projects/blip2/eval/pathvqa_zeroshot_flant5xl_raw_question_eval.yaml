model:
  arch: blip2_t5
  model_type: pretrain_flant5xl
  use_grad_checkpoint: False
  apply_lemmatizer: False

datasets:
  path_vqa:
    prompt_mode: "raw"
    vis_processor:
      eval:
        name: "blip_image_eval"
        image_size: 224
    text_processor:
      eval:
        name: "blip_question"
    build_info:
      annotations:
        test:
          storage:
            - /root/autodl-tmp/pvqa/qas/test_vqa.pkl
      images:
        storage: /root/autodl-tmp/pvqa/images

run:
  task: path_vqa
  batch_size_train: 16
  batch_size_eval: 16
  num_workers: 4

  max_len: 20
  min_len: 1
  num_beams: 5
  inference_method: "generate"
  prompt: ""

  seed: 42
  output_dir: "output/BLIP2/PathVQA_zeroshot_flant5xl_raw_question"

  evaluate: True
  test_splits: ["test"]

  device: "cuda"
  world_size: 1
  dist_url: "env://"
  distributed: True
